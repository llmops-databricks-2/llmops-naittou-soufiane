# The agent's tools and memory (lecture 3): the search_docs custom tool against a fixed RAG workflow (3.1),
# the Genie space over docs_metadata used through its managed MCP server (3.2), and a three-turn
# conversation kept in Lakebase (3.3). The tasks run one after another to stay within the AI Gateway's
# rate limits. Run it after the docs_synced_tables job.
resources:
  jobs:
    docs_agent_tools:
      name: job-docs-agent-tools-naittou-soufiane-${bundle.target}
      budget_policy_id: "674b84ab-63b9-3f87-817d-7ba554be0a99"
      environments:
        - environment_key: default
          spec:
            environment_version: "6"
            dependencies:
              - ../dist/*.whl

      tasks:
        - task_key: docs_tools
          environment_key: default
          notebook_task:
            notebook_path: ../lecture_3/3.1_docs_tools.py
            base_parameters:
              env: ${bundle.target}

        - task_key: genie_mcp
          depends_on:
            - task_key: docs_tools
          environment_key: default
          notebook_task:
            notebook_path: ../lecture_3/3.2_genie_mcp.py
            base_parameters:
              env: ${bundle.target}

        - task_key: session_memory
          depends_on:
            - task_key: genie_mcp
          environment_key: default
          notebook_task:
            notebook_path: ../lecture_3/3.3_session_memory.py
            base_parameters:
              env: ${bundle.target}
