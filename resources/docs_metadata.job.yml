# The "Prepare data" job of the Docs Curator: two serverless notebook tasks that install your
# docs_curator wheel. The first merges the metadata of the bundles and jobs documentation pages into
# docs_metadata (lecture 1); the second downloads, parses, chunks and embeds the new or updated
# pages into parsed_docs and docs_chunks (lecture 2), all in your schema of the target's catalog
# (dev: llmops_dev.naittou_soufiane).
# The daily schedule is paused; development mode pauses it in dev anyway.
resources:
  jobs:
    docs_metadata:
      name: job-docs-metadata-naittou-soufiane-${bundle.target}
      budget_policy_id: "674b84ab-63b9-3f87-817d-7ba554be0a99"
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: "Europe/Amsterdam"
        pause_status: PAUSED
      environments:
        - environment_key: default
          spec:
            environment_version: "6"
            dependencies:
              - ../dist/*.whl

      tasks:
        - task_key: docs_metadata_ingestion
          environment_key: default
          notebook_task:
            notebook_path: ../lecture_1/1.3_docs_metadata_ingestion.py
            base_parameters:
              env: ${bundle.target}

        - task_key: process_doc_pages
          depends_on:
            - task_key: docs_metadata_ingestion
          environment_key: default
          notebook_task:
            notebook_path: ../lecture_2/2.2_process_doc_pages.py
            base_parameters:
              env: ${bundle.target}
